on:
  workflow_dispatch:

jobs:
  say_hello:
    name: "Let's greet the user!"
    runs-on: ubuntu-latest
    steps:
      - id: get-time
        name: Grab the curremt time
        run: |
          curTime=$(date)
          echo "currenttime="${curTime} >> $GITUHB_OUTPUT
      - run: echo "The time from the previous step is ${{ steps.get-time.outputs.currenttime }}"